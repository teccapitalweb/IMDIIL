<!DOCTYPE html>
<html lang="es" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E0A06">
<meta name="description" content="IMDIIL Admin · Panel de administración">
<title>IMDIIL · Admin</title>
<link rel="icon" type="image/png" href="assets/imdiil-favicon.png">
<link rel="apple-touch-icon" href="assets/imdiil-apple-touch.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
/* IMDIIL ADMIN · misma identidad agri-futurista que vip-panel */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none;cursor:pointer}
img{display:block;max-width:100%}
svg{flex-shrink:0}
input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--primary);color:#fff}

:root[data-theme="night"]{
  --bg:#0E0A06;--bg-deep:#070503;
  --surface:#1A130D;--surface-2:#251C13;--surface-3:#33271C;
  --border:rgba(255,230,200,0.07);--border-2:rgba(255,230,200,0.14);--border-strong:rgba(255,230,200,0.22);
  --text:#F5F0E6;--text-2:#B0A492;--text-3:#6F6555;
  --primary:#FF7A2D;--primary-soft:#FFB377;--primary-deep:#E85A14;
  --primary-glow:rgba(255,122,45,0.38);--highlight:#FFB347;
  --success:#34D399;--danger:#F87171;--warning:#FBBF24;--whatsapp:#22C55E;
  --info:#3B82F6;--accent:#A855F7;
  --shadow-card:0 10px 40px rgba(0,0,0,0.5);
}
:root[data-theme="day"]{
  --bg:#F4EFE3;--bg-deep:#E8DCC8;
  --surface:#FFFFFF;--surface-2:#FBF6EB;--surface-3:#F2EAD8;
  --border:rgba(26,20,16,0.07);--border-2:rgba(26,20,16,0.14);--border-strong:rgba(26,20,16,0.24);
  --text:#1A1410;--text-2:#5A5044;--text-3:#8A7F70;
  --primary:#FF7A2D;--primary-soft:#FFB377;--primary-deep:#E85A14;
  --primary-glow:rgba(255,122,45,0.32);--highlight:#FF9148;
  --success:#0F9D58;--danger:#DC2D3F;--warning:#E89B1F;--whatsapp:#16A34A;
  --info:#3B82F6;--accent:#A855F7;
  --shadow-card:0 8px 32px rgba(58,40,20,0.08);
}

body{
  font-family:'Inter',sans-serif;
  font-size:14px;line-height:1.5;
  color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}

.app{display:grid;grid-template-columns:228px 1fr;height:100vh}

/* SIDEBAR */
.sidebar{
  background:var(--bg-deep);
  border-right:1px solid var(--border);
  padding:18px 14px;
  overflow-y:auto;
  display:flex;flex-direction:column;gap:8px;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:3px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:8px}
.brand__logo{width:36px;height:36px;border-radius:9px;background:#1A1410;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.brand__logo svg{width:24px;height:24px}
.brand__logo img{width:28px;height:28px;object-fit:contain;display:block}
.brand__name{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:15px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand__role{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--primary);
  padding:3px 8px;border-radius:100px;
  background:color-mix(in srgb,var(--primary) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);
  display:inline-flex;align-items:center;gap:5px;margin-top:3px;
}
.brand__role::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--primary);animation:pulseDotSmall 1.8s ease-out infinite;box-shadow:0 0 6px var(--primary-glow)}

.nav-section{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.nav-label{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--text-3);padding:8px 12px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:10px;
  font-size:13px;font-weight:500;color:var(--text-2);
  transition:color .15s,background .15s;
  position:relative;
}
.nav-item:hover{color:var(--text);background:var(--surface)}
.nav-item.is-active{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.nav-item .ic{width:16px;height:16px;flex-shrink:0}
.nav-item__badge{
  margin-left:auto;
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;font-weight:700;
  padding:2px 7px;border-radius:100px;
  background:var(--surface-2);color:var(--text-3);
}
.nav-item.is-active .nav-item__badge{background:var(--primary);color:#fff}

/* MAIN */
.main{overflow-y:auto;background:var(--bg);position:relative}
.main::-webkit-scrollbar{width:8px}
.main::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:4px}

.topbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.topbar__pill{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
  padding:7px 13px;border-radius:100px;
  background:color-mix(in srgb,var(--primary) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);
  color:var(--primary);
}
.topbar__pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);animation:pulseDotSmall 1.8s ease-out infinite;box-shadow:0 0 6px var(--primary-glow)}
.topbar__right{display:flex;align-items:center;gap:10px}
.theme-toggle,.icon-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border-2);
  color:var(--text-2);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.theme-toggle:hover,.icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
.theme-toggle .ic,.icon-btn .ic{width:16px;height:16px}
.avatar{
  display:flex;align-items:center;gap:9px;
  padding:6px 12px 6px 6px;border-radius:100px;
  background:var(--surface);border:1px solid var(--border-2);
}
.avatar__pic{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-deep));
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;letter-spacing:-.2px;
  flex-shrink:0;
}
.avatar__name{font-size:12px;font-weight:600;letter-spacing:-.1px;line-height:1.1}
.avatar__role{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--primary);font-weight:700;letter-spacing:.6px;margin-top:1px}

.page{padding:28px 32px 80px;max-width:1240px;margin:0 auto}

/* SEC HERO */
.sec-hero{padding:10px 0 24px;border-bottom:1px solid var(--border);margin-bottom:28px}
.sec-hero__eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase;
  color:var(--primary);
  padding:7px 13px;border-radius:100px;
  background:color-mix(in srgb,var(--primary) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--primary) 28%,transparent);
}
.sec-hero__eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);animation:pulseDotSmall 1.8s ease-out infinite;box-shadow:0 0 8px var(--primary-glow)}
.sec-hero__title{
  font-family:'Plus Jakarta Sans','Inter',sans-serif;
  font-size:clamp(28px,3.4vw,38px);font-weight:800;letter-spacing:-1.1px;line-height:1.05;
  margin-top:14px;
  background:linear-gradient(135deg,var(--text),color-mix(in srgb,var(--text) 55%,transparent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.sec-hero__sub{font-size:14px;color:var(--text-2);margin-top:10px;max-width:680px;line-height:1.6}
.sec-hero__actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px 22px;
  position:relative;overflow:hidden;
  transition:transform .25s cubic-bezier(.2,.8,.25,1),border-color .25s,box-shadow .3s;
}
.kpi-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--c1,var(--primary)),var(--c2,var(--highlight)),var(--c1,var(--primary)));
  background-size:200% 100%;
  animation:shimmerBar 3.5s ease-in-out infinite;
  border-radius:20px 20px 0 0;
}
@keyframes shimmerBar{0%,100%{background-position:0 0}50%{background-position:200% 0}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.kpi-card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c1,var(--primary)) 35%,transparent);box-shadow:0 14px 36px rgba(0,0,0,.12)}
.kpi-card__label{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--text-3);display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;
}
.kpi-card__label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c1,var(--primary));animation:pulseDotSmall 2s ease-out infinite;box-shadow:0 0 8px var(--c1,var(--primary))}
.kpi-card__value{
  font-family:'Plus Jakarta Sans','Inter',sans-serif;
  font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1;
  font-feature-settings:"tnum" 1;
  background:linear-gradient(135deg,var(--text),color-mix(in srgb,var(--text) 55%,transparent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.kpi-card__sub{font-size:11.5px;color:var(--text-2);margin-top:8px;font-weight:500}
.kpi-card__sub strong{color:var(--c1,var(--primary));font-weight:700}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:11px 22px;border-radius:100px;
  font-size:13px;font-weight:700;letter-spacing:-.1px;
  cursor:pointer;transition:all .2s cubic-bezier(.2,.8,.25,1);
  border:1px solid transparent;
}
.btn .ic{width:14px;height:14px}
.btn--accent{
  background:linear-gradient(135deg,var(--primary),var(--primary-deep));
  color:#fff;
  box-shadow:0 8px 22px var(--primary-glow),inset 0 1px 0 rgba(255,255,255,.18);
}
.btn--accent:hover{transform:translateY(-2px);box-shadow:0 12px 32px var(--primary-glow),inset 0 1px 0 rgba(255,255,255,.22)}
.btn--ghost{background:var(--surface);color:var(--text);border-color:var(--border-2)}
.btn--ghost:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.btn--danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn--danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent);transform:translateY(-1px)}
.btn--sm{padding:8px 14px;font-size:11.5px}

/* Inputs */
.input,.select,.textarea{
  width:100%;
  padding:11px 14px;
  background:var(--surface);
  border:1px solid var(--border-2);
  border-radius:11px;
  font-size:13px;color:var(--text);
  transition:border-color .15s,box-shadow .15s;
}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-glow)}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.textarea{resize:vertical;min-height:80px;line-height:1.5;font-family:inherit}
.select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236F6555' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}

.label{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:7px;display:block;
}

/* Tags */
.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:100px;
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  background:var(--surface-2);color:var(--text-2);
  border:1px solid var(--border);
}
.tag--success{background:color-mix(in srgb,var(--success) 12%,transparent);color:var(--success);border-color:color-mix(in srgb,var(--success) 28%,transparent)}
.tag--success::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--success);animation:pulseDotSmall 2s ease-out infinite;box-shadow:0 0 5px var(--success)}
.tag--warning{background:color-mix(in srgb,var(--warning) 12%,transparent);color:var(--warning);border-color:color-mix(in srgb,var(--warning) 28%,transparent)}
.tag--danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 28%,transparent)}
.tag--info{background:color-mix(in srgb,var(--info) 12%,transparent);color:var(--info);border-color:color-mix(in srgb,var(--info) 28%,transparent)}
.tag--accent{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
.tag--primary{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 28%,transparent)}

/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.section-header__title{
  font-family:'Plus Jakarta Sans','Inter',sans-serif;
  font-size:19px;font-weight:700;letter-spacing:-.3px;
  display:inline-flex;align-items:center;gap:10px;
}
.section-header__badge{
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;font-weight:700;letter-spacing:.8px;
  padding:4px 11px;border-radius:100px;
  background:color-mix(in srgb,var(--primary) 14%,transparent);
  color:var(--primary);
  border:1px solid color-mix(in srgb,var(--primary) 28%,transparent);
  text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;
}
.section-header__badge::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--primary);animation:pulseDotSmall 1.8s ease-out infinite}

/* Toolbar */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.searchbar{position:relative;flex:1;max-width:380px;min-width:200px}
.searchbar input{
  width:100%;padding:11px 16px 11px 40px;
  background:var(--surface);border:1px solid var(--border-2);
  border-radius:100px;font-size:13px;color:var(--text);
  transition:border-color .15s,box-shadow .15s;
}
.searchbar input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-glow)}
.searchbar input::placeholder{color:var(--text-3)}
.searchbar svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text-3);width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tab{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;font-weight:700;letter-spacing:.5px;
  padding:10px 18px;border-radius:100px;
  background:var(--surface);border:1px solid var(--border-2);color:var(--text-2);
  cursor:pointer;transition:all .2s cubic-bezier(.2,.8,.25,1);
}
.tab:hover{color:var(--text);border-color:var(--border-strong);transform:translateY(-1px)}
.tab.is-active{
  background:linear-gradient(135deg,var(--primary),var(--primary-deep));
  color:#fff;border-color:var(--primary);
  box-shadow:0 6px 18px var(--primary-glow),inset 0 1px 0 rgba(255,255,255,.18);
  transform:translateY(-1px);
}

/* Tabla / lista de filas */
.adm-list{display:flex;flex-direction:column;gap:8px}
.adm-row{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 18px;
  display:flex;align-items:center;gap:14px;
  transition:transform .15s,border-color .15s,box-shadow .25s;
}
.adm-row:hover{transform:translateX(2px);border-color:var(--border-strong);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.adm-row__thumb{
  width:44px;height:44px;border-radius:11px;
  background:linear-gradient(135deg,var(--c1,var(--primary)),color-mix(in srgb,var(--c1,var(--primary)) 60%,#000));
  color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 6px 14px color-mix(in srgb,var(--c1,var(--primary)) 25%,transparent);
}
.adm-row__thumb .ic{width:20px;height:20px}
.adm-row__body{flex:1;min-width:0}
.adm-row__title{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:14px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.adm-row__meta{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;color:var(--text-3);font-weight:600;
  display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;
}
.adm-row__meta span{display:inline-flex;align-items:center;gap:5px}
.adm-row__meta .ic{width:11px;height:11px}
.adm-row__actions{display:flex;gap:6px;flex-shrink:0}
.icon-action{
  width:34px;height:34px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-2);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.icon-action:hover{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
.icon-action--danger:hover{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent);background:color-mix(in srgb,var(--danger) 6%,transparent)}
.icon-action .ic{width:14px;height:14px}

/* Form cards */
.form-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px 26px;
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-field{display:flex;flex-direction:column;gap:7px}
.form-field--full{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}

/* Dashboard cards */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:24px}
.dash-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px 24px;
}
.dash-card__header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dash-card__title{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:15px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.dash-card__title .ic{width:18px;height:18px;color:var(--primary)}
.dash-card__link{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--primary);display:inline-flex;align-items:center;gap:5px;
  transition:gap .2s;
}
.dash-card__link:hover{gap:8px}
.dash-card__link .ic{width:11px;height:11px}

/* Mini list dentro de dash-card */
.mini-list{display:flex;flex-direction:column;gap:8px}
.mini-row{
  display:flex;align-items:center;gap:11px;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.mini-row:last-child{border-bottom:none;padding-bottom:0}
.mini-row:first-child{padding-top:0}
.mini-row__dot{
  width:32px;height:32px;border-radius:50%;
  background:color-mix(in srgb,var(--c1,var(--primary)) 14%,transparent);
  color:var(--c1,var(--primary));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.mini-row__dot .ic{width:14px;height:14px}
.mini-row__body{flex:1;min-width:0}
.mini-row__title{font-size:13px;font-weight:600;letter-spacing:-.1px}
.mini-row__meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-3);font-weight:500;margin-top:2px}
.mini-row__right{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;color:var(--c1,var(--primary));font-feature-settings:"tnum" 1}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
:root[data-theme="day"] .modal-backdrop{background:rgba(26,20,16,.35)}
.modal-backdrop.is-open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border-2);border-radius:20px;
  width:100%;max-width:640px;max-height:90vh;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow-card);
  animation:modalIn .25s cubic-bezier(.2,.8,.25,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal__header{
  padding:18px 22px 14px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);
}
.modal__icon{
  width:36px;height:36px;border-radius:10px;
  background:color-mix(in srgb,var(--primary) 14%,transparent);
  color:var(--primary);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.modal__title{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:16px;font-weight:700;letter-spacing:-.2px}
.modal__subtitle{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-3);font-weight:600;margin-top:2px}
.modal__close{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal__close:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.modal__close .ic{width:14px;height:14px;stroke-width:2.2}
.modal__body{padding:20px 22px;overflow-y:auto;flex:1}
.modal__footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:60;display:flex;flex-direction:column;gap:9px;max-width:340px}
.toast{
  background:var(--surface);border:1px solid var(--border-2);border-radius:14px;
  padding:13px 16px;display:flex;gap:11px;align-items:flex-start;
  box-shadow:var(--shadow-card);
  animation:toastIn .25s cubic-bezier(.2,.8,.25,1);
  min-width:240px;
}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.toast__icon{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:color-mix(in srgb,var(--c1,var(--primary)) 14%,transparent);
  color:var(--c1,var(--primary));
}
.toast__icon .ic{width:13px;height:13px;stroke-width:2.2}
.toast--success{--c1:var(--success)}
.toast--error{--c1:var(--danger)}
.toast--info{--c1:var(--info)}
.toast__body{flex:1;min-width:0}
.toast__title{font-size:13px;font-weight:600;letter-spacing:-.1px}
.toast__msg{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.45}

/* News list */
.news-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 18px;
  display:flex;gap:14px;align-items:flex-start;
  transition:transform .15s,border-color .15s,box-shadow .25s;
}
.news-card:hover{transform:translateY(-1px);border-color:var(--border-strong);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.news-card__cover{
  width:64px;height:64px;border-radius:12px;
  background:linear-gradient(135deg,var(--c1,var(--primary)),color-mix(in srgb,var(--c1,var(--primary)) 60%,#000));
  color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 6px 14px color-mix(in srgb,var(--c1,var(--primary)) 25%,transparent);
}
.news-card__cover .ic{width:24px;height:24px}
.news-card__body{flex:1;min-width:0}
.news-card__head{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.news-card__date{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text-3);font-weight:600;letter-spacing:.8px}
.news-card__title{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:14px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.news-card__desc{font-size:12px;color:var(--text-2);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-card__source{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-3);font-weight:600;margin-top:6px;display:inline-flex;align-items:center;gap:4px}

/* Empty state */
.empty{
  text-align:center;padding:60px 28px;
  background:var(--surface);border:1px dashed var(--border-2);border-radius:18px;
}
.empty__icon{
  width:72px;height:72px;margin:0 auto 16px;border-radius:18px;
  background:var(--surface-2);color:var(--text-3);
  display:flex;align-items:center;justify-content:center;
}
.empty__icon .ic{width:32px;height:32px}
.empty h3{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:17px;font-weight:700;margin-bottom:7px}
.empty p{font-size:13px;color:var(--text-2);max-width:380px;margin:0 auto;line-height:1.55}

/* Cron card especial */
.cron-card{
  background:linear-gradient(135deg,#1A130D 0%,#0E0A06 100%);
  border:1px solid var(--border-2);
  border-radius:20px;
  padding:24px 26px;
  margin-bottom:18px;
  position:relative;overflow:hidden;
}
:root[data-theme="day"] .cron-card{background:linear-gradient(135deg,#FFFFFF 0%,#FBF6EB 100%)}
.cron-card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 80% 30%,color-mix(in srgb,var(--success) 18%,transparent),transparent 50%);
  filter:blur(40px);pointer-events:none;
}
.cron-card__row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative;z-index:1}
.cron-card__icon{
  width:54px;height:54px;border-radius:14px;
  background:linear-gradient(135deg,var(--success),#047857);
  color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 8px 22px color-mix(in srgb,var(--success) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.18);
}
.cron-card__info{flex:1;min-width:0}
.cron-card__lbl{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--success);display:inline-flex;align-items:center;gap:6px}
.cron-card__lbl::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulseDotSmall 1.8s ease-out infinite;box-shadow:0 0 8px var(--success)}
.cron-card__title{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.4px;margin-top:4px}
.cron-card__sub{font-size:12.5px;color:var(--text-2);margin-top:4px}

@keyframes pulseDotSmall{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.4}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .4s ease forwards}

/* Mobile nav */
.mobile-nav{display:none}

/* RESPONSIVE */
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .page{padding:14px 14px 100px}
  .topbar{padding:12px 14px}
  .avatar__name,.avatar__role{display:none}
  .avatar{padding:5px}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--border-2);padding:6px 4px max(6px,env(safe-area-inset-bottom));justify-content:space-around;align-items:center}
  .mobile-nav__item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-3);padding:5px 8px;border-radius:8px;font-size:9.5px;font-weight:600;letter-spacing:.3px}
  .mobile-nav__item.is-active{color:var(--primary)}
  .mobile-nav__item .ic{width:18px;height:18px}
  .form-grid{grid-template-columns:1fr}
  .dash-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .kpi-card{padding:14px 16px}
  .kpi-card__value{font-size:24px}
  .adm-row{flex-wrap:wrap;gap:10px}
  .adm-row__actions{margin-left:auto}
  .modal__body{padding:18px}
  .modal__footer .btn{flex:1;min-width:100px}
}
</style>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, orderBy, where, limit, onSnapshot, serverTimestamp, Timestamp, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUOR5_ki-BeL_pSnoKIhVre9_CsMDKsZc",
  authDomain: "imdiil-vip.firebaseapp.com",
  projectId: "imdiil-vip",
  storageBucket: "imdiil-vip.firebasestorage.app",
  messagingSenderId: "875137053237",
  appId: "1:875137053237:web:65d81cceb6b5ec233bb77c"
};
const ADMINS = ["teccapitalweb@gmail.com","imdiilmx@gmail.com","imdiilconsultoria@gmail.com"];

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
setPersistence(auth, browserLocalPersistence);

// Exponer Firebase y helpers globalmente para que el script no-module los use
window._fb = {
  db, auth,
  collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc,
  query, orderBy, where, limit, onSnapshot,
  serverTimestamp, Timestamp, writeBatch, increment
};
window.__adminEmails = ADMINS;

onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = 'vip-auth.html'; return; }
  const email = (user.email||'').toLowerCase();
  if (!ADMINS.includes(email)) { window.location.href = 'vip-panel.html'; return; }
  // Es admin: mostrar contenido + actualizar avatar
  window.__currentAdmin = { uid: user.uid, email, displayName: user.displayName || email };
  document.body.style.visibility = 'visible';
  const nameEl = document.querySelector('.avatar__name');
  const picEl = document.querySelector('.avatar__pic');
  if (nameEl && user.displayName) nameEl.textContent = user.displayName.split(' ').slice(0,2).join(' ');
  if (picEl) picEl.textContent = (user.displayName||email).split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase().slice(0,2);

  // Disparar evento para que el resto del JS sepa que Firebase está listo
  window.dispatchEvent(new CustomEvent('adminready', { detail: { email, uid: user.uid } }));
});

// Cerrar sesión real
window.__signOut = async () => {
  try { await signOut(auth); window.location.href = 'vip-auth.html'; }
  catch(e){ alert('No pudimos cerrar sesión. Intenta de nuevo.'); }
};
</script>

const Toast={
  show(type,title,msg,dur=3500){
    const c=document.getElementById('toast-container');
    const t=document.createElement('div');
    t.className='toast toast--'+type;
    const icons={success:'i-check',error:'i-close',info:'i-bolt'};
    t.innerHTML=`<div class="toast__icon"><svg class="ic"><use href="#${icons[type]||'i-bolt'}"/></svg></div><div class="toast__body"><div class="toast__title">${title}</div>${msg?`<div class="toast__msg">${msg}</div>`:''}</div>`;
    c.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px)';setTimeout(()=>t.remove(),250);},dur);
  },
  success(t,m){this.show('success',t,m)},
  error(t,m){this.show('error',t,m)},
  info(t,m){this.show('info',t,m)}
};

const Modal={
  current:null,
  open({title,subtitle,icon='i-plus',body,footer,onClose}){

    document.getElementById('modal-body').innerHTML='';
    if(typeof body==='string')document.getElementById('modal-body').innerHTML=body;
    else if(body)document.getElementById('modal-body').appendChild(body);
    document.getElementById('modal-footer').innerHTML='';
    if(typeof footer==='string')document.getElementById('modal-footer').innerHTML=footer;
    else if(footer)document.getElementById('modal-footer').appendChild(footer);
    document.getElementById('modal-backdrop').classList.add('is-open');
    this.current={onClose};
  },
  close(){
    document.getElementById('modal-backdrop').classList.remove('is-open');
    if(this.current?.onClose)this.current.onClose();

  }
};

  cursos(p){

      const q=(document.getElementById('curso-search').value||'').toLowerCase();

      const items=SEED.cursos.filter(c=>{
        if(a!=='todas'&&c.area!==a)return false;

        return true;
      });
      const list=document.getElementById('curso-list');

      const colorArea={'Seguridad':'#FF7A2D','Logística':'#3B82F6','Calidad':'#10B981','Mantenimiento':'#A855F7'};
      list.innerHTML=items.map(c=>`

              <span><svg class="ic"><use href="#i-users"/></svg>${c.inscritos}</span>
            </div>
          </div>
          <span class="tag ${c.activo?'tag--success':'tag--warning'}">${c.activo?'Activo':'Inactivo'}</span>
          <div class="adm-row__actions">
            <button class="icon-action" data-edit="${c.id}" title="Editar"><svg class="ic"><use href="#i-edit"/></svg></button>

    function cursoModal(id){
      const c=id?SEED.cursos.find(x=>x.id===id):{titulo:'',area:'Seguridad',nivel:'Básico',instructor:'',horas:8,modulos:5,activo:true,inscritos:0};
      const body=`
        <div class="form-grid">
          <div class="form-field form-field--full"><label class="label">Título del curso</label><input type="text" class="input" id="f-titulo" value="${(c.titulo||'').replace(/"/g,'&quot;')}" placeholder="Ej: NOM-019-STPS · Comisiones…"></div>
          <div class="form-field"><label class="label">Área</label><select class="select" id="f-area"><option ${c.area==='Seguridad'?'selected':''}>Seguridad</option><option ${c.area==='Logística'?'selected':''}>Logística</option><option ${c.area==='Calidad'?'selected':''}>Calidad</option><option ${c.area==='Mantenimiento'?'selected':''}>Mantenimiento</option></select></div>
          <div class="form-field"><label class="label">Nivel</label><select class="select" id="f-nivel"><option ${c.nivel==='Básico'?'selected':''}>Básico</option><option ${c.nivel==='Intermedio'?'selected':''}>Intermedio</option><option ${c.nivel==='Avanzado'?'selected':''}>Avanzado</option></select></div>
          <div class="form-field form-field--full"><label class="label">Instructor</label><input type="text" class="input" id="f-instructor" value="${(c.instructor||'').replace(/"/g,'&quot;')}" placeholder="Ej: Ing. María López"></div>
          <div class="form-field"><label class="label">Horas totales</label><input type="number" class="input" id="f-horas" value="${c.horas}" min="1"></div>
          <div class="form-field"><label class="label">Módulos</label><input type="number" class="input" id="f-modulos" value="${c.modulos}" min="1"></div>
          <div class="form-field form-field--full" style="display:flex;align-items:center;gap:10px;flex-direction:row;"><input type="checkbox" id="f-activo" ${c.activo?'checked':''}><label for="f-activo" style="cursor:pointer;font-size:13px;font-weight:500;">Curso activo · visible en el catálogo</label></div>
        </div>
      `;
      const footer=document.createElement('div');
      footer.innerHTML=`<button class="btn btn--ghost" id="m-cancel">Cancelar</button><button class="btn btn--accent" id="m-save">${id?'Guardar cambios':'Crear curso'}<svg class="ic"><use href="#i-check"/></svg></button>`;
      Modal.open({title:id?'Editar curso':'Nuevo curso',subtitle:id?c.titulo:'Define los datos del nuevo curso',icon:'i-book',body,footer});
      footer.querySelector('#m-cancel').addEventListener('click',()=>Modal.close());
      footer.querySelector('#m-save').addEventListener('click',()=>{
        const data={titulo:document.getElementById('f-titulo').value.trim(),area:document.getElementById('f-area').value,nivel:document.getElementById('f-nivel').value,instructor:document.getElementById('f-instructor').value.trim(),horas:+document.getElementById('f-horas').value,modulos:+document.getElementById('f-modulos').value,activo:document.getElementById('f-activo').checked};
        if(!data.titulo){Toast.error('Falta el título','Escribe el nombre del curso.');return;}
        if(!data.instructor){Toast.error('Falta instructor','Define quién imparte el curso.');return;}
        if(id){Object.assign(c,data);Toast.success('Curso actualizado',data.titulo);}
        else{SEED.cursos.unshift({id:'c'+Date.now(),inscritos:0,...data});Toast.success('Curso creado',data.titulo);}
        Modal.close();renderCursos();
      });
    }
  },

        </div>
      `;
      const footer=document.createElement('div');
      footer.innerHTML=`<button class="btn btn--ghost" id="m-cancel">Cancelar</button><button class="btn btn--accent" id="m-save">${id?'Guardar':'Agregar'}<svg class="ic"><use href="#i-check"/></svg></button>`;

              <div class="mini-row" style="--c1:#FBBF24;"><div class="mini-row__dot"><svg class="ic"><use href="#i-bolt"/></svg></div><div class="mini-row__body"><div class="mini-row__title">Stripe LIVE</div><div class="mini-row__meta">Webhook pendiente de conectar</div></div><span class="tag tag--warning">Pendiente</span></div>
              <div class="mini-row" style="--c1:#34D399;"><div class="mini-row__dot"><svg class="ic"><use href="#i-refresh"/></svg></div><div class="mini-row__body"><div class="mini-row__title">Railway Cron (noticias)</div><div class="mini-row__meta">Última: ${c.cronUltima}</div></div><span class="tag tag--success">OK</span></div>
              <div class="mini-row" style="--c1:#FBBF24;"><div class="mini-row__dot"><svg class="ic"><use href="#i-mail"/></svg></div><div class="mini-row__body"><div class="mini-row__title">EmailJS · Certificados</div><div class="mini-row__meta">Sin configurar</div></div><span class="tag tag--warning">Pendiente</span></div>
            </div>
          </div>
        </div>
      </div>
    `;
    p.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>{
      const type=b.dataset.save;
      if(type==='precios'){c.precioMensual=+document.getElementById('cfg-mens').value;c.precioAnual=+document.getElementById('cfg-anual').value;c.stripePublicKey=document.getElementById('cfg-stripe').value;Toast.success('Precios actualizados');}
      else if(type==='contacto'){c.whatsapp=document.getElementById('cfg-wa').value;c.instagram=document.getElementById('cfg-ig').value;c.emailContacto=document.getElementById('cfg-em').value;Toast.success('Contacto actualizado');}
    }));
    document.getElementById('add-admin').addEventListener('click',()=>{
      const e=document.getElementById('cfg-new-admin').value.trim();
      if(!e||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){Toast.error('Email inválido');return;}
      if(c.admins.includes(e)){Toast.error('Ya existe');return;}
      c.admins.push(e);Toast.success('Admin agregado',e);Pages.config(p);
    });
    p.querySelectorAll('[data-rm-admin]').forEach(b=>b.addEventListener('click',()=>{
      const i=+b.dataset.rmAdmin;
      if(confirm('¿Eliminar este administrador?')){c.admins.splice(i,1);Toast.success('Admin eliminado');Pages.config(p);}
    }));
  }
};

/* =========================================================
   ROUTER
   ========================================================= */
function navigate(section){
  document.querySelectorAll('.nav-item, .mobile-nav__item').forEach(n=>n.classList.remove('is-active'));
  document.querySelectorAll(`[data-section="${section}"]`).forEach(n=>n.classList.add('is-active'));
  const p=document.getElementById('page');
  const fn=Pages[section]||Pages.dashboard;
  fn(p);
  window.scrollTo({top:0,behavior:'instant'});
  document.querySelector('.main')?.scrollTo({top:0,behavior:'instant'});
}

/* =========================================================
   ADMIN STORE · estado reactivo conectado a Firestore
   Inspirado en la lógica de Sinergia · cargas en tiempo real
   ========================================================= */
const AdminStore = {
  // Datos vivos (se llenan al conectar con Firestore)
  cursos: [],
  pdfs: [],
  webinars: [],
  miembros: [],
  certificados: [],
  noticias: [],
  notificaciones: [],

  // Estado del store
  ready: false,
  unsubs: [],  // listeners de onSnapshot para limpiar al cerrar sesión
  listeners: new Set(),  // callbacks que se ejecutan al cambiar el store

  /**
   * Inicializa todos los listeners de Firestore.
   * Se llama UNA SOLA VEZ cuando admin está autenticado.
   */
  init() {
    const fb = window._fb;
    if (!fb || !fb.db) {
      console.warn('[AdminStore] Firebase no listo · reintentando en 500ms');
      setTimeout(() => this.init(), 500);
      return;
    }
    if (this.ready) return; // ya inicializado
    this.ready = true;

    const { db, collection, query, orderBy, onSnapshot, limit } = fb;

    // ─── 1. CURSOS ───
    try {
      const q = query(collection(db, 'cursos'), orderBy('titulo', 'asc'));
      const u = onSnapshot(q, (snap) => {
        this.cursos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        this._emit('cursos');
      }, (err) => console.warn('[AdminStore] cursos:', err.message));
      this.unsubs.push(u);
    } catch(e) { console.warn('[AdminStore] cursos init:', e.message); }

    // ─── 2. MATERIALES (PDFs) ───
    try {
      const q = query(collection(db, 'materiales'), orderBy('fecha', 'desc'));
      const u = onSnapshot(q, (snap) => {
        this.pdfs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        this._emit('pdfs');
      }, (err) => { /* col aún no existe · OK */ });
      this.unsubs.push(u);
    } catch(e) { /* OK · se creará al primer doc */ }

    // ─── 3. WEBINARS / Clases en vivo ───
    try {
      const q = query(collection(db, 'webinars'), orderBy('fecha', 'desc'));
      const u = onSnapshot(q, (snap) => {
        this.webinars = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        this._emit('webinars');
      }, (err) => { /* OK */ });
      this.unsubs.push(u);
    } catch(e) {}

    // ─── 4. MIEMBROS ───
    try {
      const q = query(collection(db, 'miembros'), orderBy('createdAt', 'desc'), limit(500));
      const u = onSnapshot(q, (snap) => {
        this.miembros = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        this._emit('miembros');
      }, (err) => console.warn('[AdminStore] miembros:', err.message));
      this.unsubs.push(u);
    } catch(e) { console.warn('[AdminStore] miembros init:', e.message); }

    // ─── 5. CERTIFICADOS ───
    try {
      const q = query(collection(db, 'certificados'), orderBy('emitido', 'desc'), limit(200));
      const u = onSnapshot(q, (snap) => {
        this.certificados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        this._emit('certificados');
      }, (err) => { /* OK · col puede no existir aún */ });
      this.unsubs.push(u);
    } catch(e) {}

    // ─── 6. NOTICIAS (col que ya existe del cron) ───
    try {
      const q = query(collection(db, 'noticias_auto'), orderBy('fecha', 'desc'), limit(20));
      const u = onSnapshot(q, (snap) => {
        this.noticias = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        this._emit('noticias');
      }, (err) => { /* OK */ });
      this.unsubs.push(u);
    } catch(e) {}

    // ─── 7. NOTIFICACIONES ───
    try {
      const q = query(collection(db, 'notificaciones'), orderBy('createdAt', 'desc'), limit(50));
      const u = onSnapshot(q, (snap) => {
        this.notificaciones = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        this._emit('notificaciones');
      }, (err) => { /* OK */ });
      this.unsubs.push(u);
    } catch(e) {}

    console.log('[AdminStore] ✅ Listeners de Firestore activos');
  },

  // KPIs calculados en tiempo real
  get stats() {
    const miembrosActivos = this.miembros.filter(m => m.activo !== false).length;
    const cursosActivos = this.cursos.filter(c => c.activo !== false && c.disponible !== false).length;
    const cursosInactivos = this.cursos.length - cursosActivos;
    const ahora = new Date();
    const webinarsProx = this.webinars.filter(w => {
      const f = w.fecha?.toDate ? w.fecha.toDate() : (w.fecha ? new Date(w.fecha) : null);
      return f && f > ahora;
    }).length;
    const pdfsPubl = this.pdfs.filter(p => p.publicado !== false).length;
    const noticiasHoy = this.noticias.filter(n => {
      const f = n.fecha?.toDate ? n.fecha.toDate() : (n.fecha ? new Date(n.fecha) : null);
      if (!f) return false;
      const diff = (Date.now() - f.getTime()) / 86400000;
      return diff < 1;
    }).length;
    return {
      miembrosActivos,
      miembrosTotal: this.miembros.length,
      cursosActivos,
      cursosTotal: this.cursos.length,
      cursosInactivos,
      certEmitidos: this.certificados.length,
      webinarsProx,
      pdfsPubl,
      pdfsTotal: this.pdfs.length,
      noticiasHoy,
      notifTotal: this.notificaciones.length
    };
  },

  // Sistema de suscripción a cambios (para re-renderear vistas que dependen de los datos)
  subscribe(callback) {
    this.listeners.add(callback);
    return () => this.listeners.delete(callback);
  },
  _emit(what) {
    // Re-renderear la sección actual si depende de los datos
    this.listeners.forEach(cb => { try { cb(what); } catch(e){} });
    // Auto re-render de la sección actual del panel
    this._autoRerender();
  },
  _autoRerender() {
    // Detecta cuál es la sección activa y re-renderiza
    const active = document.querySelector('.nav-item.is-active[data-section]');
    if (!active) return;
    const section = active.dataset.section;
    const p = document.getElementById('page');
    if (!p) return;
    // Solo dashboard se auto-rerendera ahora · las demás secciones se harán en Fases siguientes
    if (section === 'dashboard' && Pages[section]) {
      Pages[section](p);
    }
  },

  // Limpiar listeners (al cerrar sesión)
  destroy() {
    this.unsubs.forEach(u => { try { u(); } catch(e){} });
    this.unsubs = [];
    this.ready = false;
  }
};
window.AdminStore = AdminStore;

});
